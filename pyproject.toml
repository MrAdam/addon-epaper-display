[project]
name = "epaper-display"
version = "0.8.4"
requires-python = ">=3.11"
dependencies = [
    "croniter",
    "numpy",
    "playwright",
    "Pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epaper_display"]
