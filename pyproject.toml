[project]
name = "epaper-display"
version = "0.8.5"
requires-python = ">=3.11"
dependencies = [
    "croniter",
    "numpy",
    "playwright",
    "Pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epaper_display"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty==0.0.32",
]

[tool.ty.analysis]
replace-imports-with-any = ["croniter.**", "epaper.**"]

[tool.ruff]
target-version = "py311"
src = ["src", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF003", # Ambiguous Unicode chars in comments (intentional)
]

[tool.ruff.lint.per-file-ignores]
"src/epaper_display/capture.py" = ["E501", "SIM105"]
"examples/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
