name: E-Paper Display
description: Serves e-paper optimised dashboard screenshots over HTTP
version: 0.8.2
slug: epaper_display
init: false
arch:
  - amd64
  - aarch64
ports:
  3412/tcp: 3412
ports_description:
  3412/tcp: Screenshot HTTP endpoint
options:
  url: http://homeassistant.local:8123/lovelace/0
  token: ''
  direct: false
  cron: '*/15 * * * *'
  width: 800
  height: 480
  dithering: floyd-steinberg
  normalize: true
  gamma_correction: true
  hide_sidebar: true
  hide_toolbar: false
  zoom: 1
  chromium_flags: >-
    --hide-scrollbars --disable-notifications --disable-extensions
    --disable-sync --disable-background-timer-throttling
schema:
  url: url
  token: password
  direct: bool
  cron: str
  width: int(100,3840)
  height: int(100,2160)
  dithering: list(floyd-steinberg|ordered|none)
  normalize: bool
  gamma_correction: bool
  hide_sidebar: bool
  hide_toolbar: bool
  zoom: float(0.25,4.0)
  chromium_flags: str
